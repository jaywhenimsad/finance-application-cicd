services:
  frontend:
    build: ./frontend
    ports:
      - '80:80'
    depends_on:
      - backend
  backend:
    build: ./backend
    environment:
      MYSQL_HOST: mysql-db
      MYSQL_USER: root
      MYSQL_PASSWORD: admin123
      MYSQL_DATABASE: bluevault_db
    expose:
      - '5000'
    depends_on:
      - mysql-db
  mysql-db:
    build: ./mysql
    environment:
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_DATABASE: bluevault_db
    ports:
      - '3306:3306'
